<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../dasan/fonts/black-han-sans/400.css">
<style>
  @font-face { font-family: P; font-weight: 900; src: url(fonts/Pretendard-Black.woff2); }
  @font-face { font-family: P; font-weight: 800; src: url(fonts/Pretendard-ExtraBold.woff2); }
  * { margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  #pre { position: absolute; left: -9999px; }
</style>
</head>
<body>
<canvas id="cv" width="1920" height="1080"></canvas>
<div id="pre"></div>
<script>
/* Type + shapes + straight lines + curves only. Two candidate directions:
   A "줄넘기"  — a curved rope swings every beat over a straight floor line; the words are the jumpers.
   B "그리드 팝" — giant cropped words, circles and bars locked to a grid; each bar flips the colour. */
const W = 1920, H = 1080;
const PINK = '#FF2D95', LIME = '#B6F02A', CYAN = '#19C3F5', ORANGE = '#FF7A00', YEL = '#FFE14D';
const BLK = '#111111', WH = '#FFFFFF';
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
function bg(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function T(s, x, y, size, o = {}) {
  ctx.save(); ctx.translate(x, y); if (o.rot) ctx.rotate(o.rot * Math.PI / 180); ctx.scale(o.sx || 1, o.sy || 1);
  ctx.font = `${o.w ? o.w + ' ' : ''}${size}px ${o.f || "'Black Han Sans'"}`; ctx.textAlign = o.al || 'center'; ctx.textBaseline = 'middle';
  if (o.stroke) { ctx.lineJoin = 'round'; ctx.lineWidth = o.stroke; ctx.strokeStyle = o.sc || BLK; ctx.strokeText(s, 0, 0); }
  ctx.fillStyle = o.c || BLK; ctx.fillText(s, 0, 0); ctx.restore();
}
function circ(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); }
function line(x1, y1, x2, y2, w, c) { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function rope(x1, y1, x2, y2, cx, cy, w, c) { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.quadraticCurveTo(cx, cy, x2, y2); ctx.stroke(); }
function tri(x, y, s, rot, c) { ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(0, -s); ctx.lineTo(s * .87, s * .5); ctx.lineTo(-s * .87, s * .5); ctx.closePath(); ctx.fill(); ctx.restore(); }
function bar(x, y, w, h, c, r = h / 2) { ctx.fillStyle = c; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }

const FR = {
  // ---------- A: 줄넘기 ----------
  A_hook() {        // "다산한의원" — five syllables hop the rope one after another (a wave)
    bg(PINK);
    line(80, 880, 1840, 880, 10, BLK);                              // floor
    rope(150, 640, 1770, 640, 960, -260, 16, WH);                   // the rope, swung over the top
    circ(150, 640, 26, BLK); circ(1770, 640, 26, BLK);              // handles
    const hops = [40, 120, 210, 120, 40];
    '다산한의원'.split('').forEach((c, i) => {
      const x = 960 + (i - 2) * 270, y = 760 - hops[i];
      ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.beginPath(); ctx.ellipse(x, 885, 110 - hops[i] * .25, 12, 0, 0, 7); ctx.fill();
      T(c, x, y, 250, { c: WH, sy: 1 + hops[i] / 900, sx: 1 - hops[i] / 1500 });
    });
    T('호평동', 150, 130, 92, { al: 'left', c: BLK });
    T('다이어트', 1770, 130, 92, { al: 'right', c: BLK });
    circ(960, 210, 34, YEL); tri(560, 330, 30, .3, BLK); tri(1360, 330, 30, -.3, BLK);
  },
  A_verse() {       // "뱃살은 쭉!" — the rope passes under; 쭉 stretches along the floor line
    bg(LIME);
    line(80, 880, 1840, 880, 10, BLK);
    rope(150, 640, 1770, 640, 960, 1060, 16, BLK);                  // rope swung under the feet
    circ(150, 640, 26, BLK); circ(1770, 640, 26, BLK);
    T('뱃살은', 960, 230, 200, { c: BLK });
    T('쭉!', 960, 560, 330, { c: BLK, sx: 2.3, sy: .82 });
    circ(330, 300, 70, PINK); line(1500, 230, 1760, 230, 14, BLK); line(1540, 270, 1720, 270, 14, BLK);
  },
  // ---------- B: 그리드 팝 ----------
  B_hook() {        // giant cropped "다산한의원" with the other two words as bars and a vertical line
    bg(CYAN);
    ctx.strokeStyle = 'rgba(17,17,17,.12)'; ctx.lineWidth = 2;
    for (let x = 0; x <= W; x += 120) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = 0; y <= H; y += 120) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    circ(1500, 600, 360, PINK);
    T('다산', 700, 520, 600, { c: BLK, sx: 1.05 });
    T('한의원', 1180, 860, 420, { c: WH });
    bar(120, 120, 560, 120, YEL); T('호평동', 400, 182, 96, { c: BLK });
    bar(1240, 120, 560, 120, BLK); T('다이어트', 1520, 182, 96, { c: WH });
    line(120, 1000, 1800, 1000, 10, BLK);
  },
  B_bridge() {      // "호평로 33 · 이마트 그 건물" — roads are straight lines, 33 sits in a circle
    bg(ORANGE);
    line(-50, 760, 1970, 760, 64, BLK); line(-50, 760, 1970, 760, 6, YEL);            // 호평로
    line(1180, -50, 1180, 1130, 40, BLK);
    circ(560, 470, 230, WH); T('33', 560, 480, 260, { c: BLK });
    T('호평로', 560, 160, 140, { c: BLK });
    ctx.fillStyle = BLK; ctx.fillRect(1370, 300, 380, 420);                             // 그 건물 = a square
    T('이마트', 1560, 380, 92, { c: WH });
    ctx.strokeStyle = WH; ctx.lineWidth = 12; ctx.lineCap = 'round';                   // curved arrow
    ctx.beginPath(); ctx.moveTo(860, 330); ctx.quadraticCurveTo(1100, 110, 1340, 330); ctx.stroke();
    tri(1345, 335, 34, 2.1, WH);
    T('그 건물!', 1560, 900, 150, { c: WH });
  },
};
const ORDER = ['A_hook', 'A_verse', 'B_hook', 'B_bridge'];
window.render = t => { ctx.clearRect(0, 0, W, H); FR[ORDER[Math.round(t)]](); };
window.fitAll = async () => {
  const s = '호평동다이어트다산한의원뱃살은쭉!이마트그건물호평로33';
  await document.fonts.load("100px 'Black Han Sans'", s); await document.fonts.ready; await new Promise(r => setTimeout(r, 300));
};
</script>
</body>
</html>
