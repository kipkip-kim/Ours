<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../dasan/fonts/black-han-sans/400.css">
<link rel="stylesheet" href="fonts/jua/400.css">
<style>
  @font-face { font-family: P; font-weight: 100; src: url(fonts/Pretendard-Thin.otf); }
  @font-face { font-family: P; font-weight: 300; src: url(fonts/Pretendard-Light.otf); }
  @font-face { font-family: P; font-weight: 800; src: url(fonts/Pretendard-ExtraBold.woff2); }
  * { margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #2340E6; }
  #pre { position: absolute; left: -9999px; }
</style>
</head>
<body>
<canvas id="cv" width="1920" height="1080"></canvas>
<div id="pre"></div>
<script>
/* 다산한의원 징글 — lyric-driven type (ref ㉓ "Sunbeam" grammar).
   One cobalt world with grain; each key word gets a typeface that acts out its meaning.
   Only type, shapes, straight lines and curves. The four hooks are drawn identically. */
const W = 1920, H = 1080;
const BLUE2 = '#1A2FB8', PINK = '#FF7AB6', YEL = '#FFE15A', WH = '#FFFFFF', INK = '#0E0F2E';
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const layer = document.createElement('canvas'); layer.width = W; layer.height = H; const L = layer.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIn = x => x * x * x;
const eInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const spring = p => p <= 0 ? 0 : p >= 1 ? 1 : 1 - Math.exp(-6.5 * p) * Math.cos(8.5 * p);
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }

/* ---------- song clock (jingle_v1_selected, 128 BPM, kick-fitted) ---------- */
const P = 0.46884, A0 = 0.0629, LEAD = .1;
const bar = k => A0 + 4 * k * P;
const beatPh = t => { const n = Math.floor((t - A0) / P); return t - (A0 + n * P); };
const sbeat = t => { const d = beatPh(t); return d < .05 ? eOut(d / .05) : Math.exp(-(d - .05) * 6); };
const HOOKS = [bar(0), bar(2), bar(7), bar(12)];
const hw = h => [h, h + 2.4 * P, h + 4.9 * P].map(x => Math.max(0, x - LEAD));
const V = { bae: 7.30, jjuk: 7.80, che: 8.05, ssok: 8.95, mom: 9.45, ga: 9.95, ma: 11.10, jeul: 11.60 };
const B = { ho: 18.60, n33: 19.20, emart: 20.05, geu: 20.75 };
const FIN = bar(14) - .02;
const HITS = [];
HOOKS.forEach(h => HITS.push(...hw(h)));
HITS.push(V.jjuk, V.ssok, V.ga, V.jeul, B.n33, B.geu, FIN);
function hitAmt(t) { let a = 0; for (const h of HITS) { const d = t - h; if (d < 0 || d > 1) continue; a = Math.max(a, d < .06 ? eOut(d / .06) : Math.exp(-(d - .06) * 7)); } return a; }

/* ---------- drawing kit (all draw into the current context C) ---------- */
let C = ctx;
const grain = document.createElement('canvas'); grain.width = 960; grain.height = 540;
{ const g = grain.getContext('2d'), im = g.createImageData(960, 540);
  for (let i = 0; i < 960 * 540; i++) { const v = hash(i * .37) * 255; im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = 34; }
  g.putImageData(im, 0, 0); }
function bg() {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#2B4BF2'); g.addColorStop(.55, '#2340E6'); g.addColorStop(1, BLUE2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function grainPass(t) {            // the grain "boils" 12 times a second, like the reference
  const f = Math.floor(t * 12), ox = Math.floor(hash(f) * 960), oy = Math.floor(hash(f + 7) * 540);
  ctx.globalCompositeOperation = 'overlay';
  for (let i = -1; i < 2; i++) for (let j = -1; j < 2; j++) ctx.drawImage(grain, i * 1920 - ox * 2 + 1920, j * 1080 - oy * 2 + 1080, 1920, 1080);
  ctx.globalCompositeOperation = 'source-over';
}
function T(s, x, y, size, o = {}) {
  C.save(); C.translate(x, y); if (o.rot) C.rotate(o.rot * Math.PI / 180); C.scale(o.sx || 1, o.sy || 1);
  C.font = `${o.w || ''} ${size}px ${o.f || "'Black Han Sans'"}`; C.textAlign = o.al || 'center'; C.textBaseline = o.bl || 'middle';
  C.letterSpacing = (o.ls || 0) + 'px';
  C.globalAlpha = o.a ?? 1; C.fillStyle = o.c || WH; C.fillText(s, 0, 0); C.restore();
}
function tw(s, size, f, w = '', ls = 0) { C.save(); C.font = `${w} ${size}px ${f}`; C.letterSpacing = ls + 'px'; const v = C.measureText(s).width; C.restore(); return v; }
function circ(x, y, r, c, sx = 1, sy = 1) { C.fillStyle = c; C.beginPath(); C.ellipse(x, y, r * sx, r * sy, 0, 0, 7); C.fill(); }
function ln(pts, w, c, a = 1) { C.save(); C.globalAlpha = a; C.strokeStyle = c; C.lineWidth = w; C.lineCap = 'round'; C.lineJoin = 'round'; C.beginPath(); pts.forEach((p, i) => i ? C.lineTo(...p) : C.moveTo(...p)); C.stroke(); C.restore(); }
function pill(s, x, y, a = 1) {
  C.save(); C.globalAlpha = a; C.font = '800 26px P'; const w = C.measureText(s).width + 36;
  C.strokeStyle = 'rgba(255,255,255,.85)'; C.lineWidth = 2.5; C.beginPath(); C.roundRect(x, y - 21, w, 42, 21); C.stroke();
  C.fillStyle = WH; C.textAlign = 'left'; C.textBaseline = 'middle'; C.fillText(s, x + 18, y + 1); C.restore(); return w;
}
function pills(list, x, y, t0, t) { let cx = x; list.forEach((s, i) => { const a = clamp((t - t0 - i * .06) * 6); cx += pill(s, cx, y + (1 - a) * 14, a) + 12; }); }
// glossy, puffy syllable (the hero treatment)
function puffy(ch, x, y, size, sc = 1, sy = 1) {
  if (sc <= .001) return;
  C.save(); C.translate(x, y); C.scale(sc, sc * sy);
  C.font = `${size}px Jua`; C.textAlign = 'center'; C.textBaseline = 'middle'; C.lineJoin = 'round';
  C.fillStyle = 'rgba(10,20,90,.30)'; C.filter = 'blur(16px)'; C.fillText(ch, 14, 36); C.filter = 'none';
  const deep = '#C8407E';
  for (let i = 12; i > 0; i--) { C.lineWidth = size * .07; C.strokeStyle = deep; C.strokeText(ch, i * .6, i * 1.1); C.fillStyle = deep; C.fillText(ch, i * .6, i * 1.1); }
  const g = C.createLinearGradient(0, -size * .6, 0, size * .6); g.addColorStop(0, '#FFD3E8'); g.addColorStop(.5, PINK); g.addColorStop(1, '#E2508F');
  C.lineWidth = size * .07; C.strokeStyle = g; C.strokeText(ch, 0, 0); C.fillStyle = g; C.fillText(ch, 0, 0);
  C.save(); C.beginPath(); C.rect(-size, -size, size * 2, size * .45); C.clip();
  C.globalAlpha = .35; C.lineWidth = size * .025; C.strokeStyle = WH; C.strokeText(ch, -size * .02, -size * .05); C.restore();
  C.restore();
}
// a word that enters per syllable: soft blur-in + rise
function sylIn(chars, xs, y, size, f, w, t0, step, t, o = {}) {
  chars.forEach((ch, i) => {
    const p = seg(t, t0 + i * step, t0 + i * step + .3); if (p <= 0) return;
    C.save(); if (p < 1) C.filter = `blur(${(1 - p) * 8}px)`;
    T(ch, xs[i], y + (1 - spring(p)) * 40, size, { f, w, al: 'left', a: clamp(p * 3), c: o.c });
    C.restore();
  });
}
const xsOf = (chars, x0, size, f, w, ls = 0) => { const out = []; let x = x0; chars.forEach(ch => { out.push(x); x += tw(ch, size, f, w) + ls; }); return out; };

/* ---------- HOOK — drawn identically every time ---------- */
const PUFF = '다산한의원'.split(''), PUFF_S = 290, PUFF_LS = 26;
function HOOK(t, k, fin) {
  const h = HOOKS[k], [t1, t2, t3] = hw(h);
  // 1) 호평동: hair-thin syllables; the ㅇ of 동 pops out as a bouncing pink ball
  const chars = ['호', '평', '동'], f = 'P', w = 100, sz = 230;
  const xs = xsOf(chars, 120, sz, f, w, -6);
  const tb = t1 + 2 * .234 + .14;                  // ball pops
  sylIn(chars.slice(0, 2), xs, 200, sz, f, w, t1, .234, t);
  { const p = seg(t, t1 + 2 * .234, t1 + 2 * .234 + .3);
    if (p > 0) {
      C.save(); if (t >= tb && !(fin && t > FIN + .3)) { C.beginPath(); C.rect(0, 0, W, 207); C.clip(); }
      if (p < 1) C.filter = `blur(${(1 - p) * 8}px)`;
      T('동', xs[2], 200 + (1 - spring(p)) * 40, sz, { f, w, al: 'left', a: clamp(p * 3) });
      C.restore();
    } }
  const bx = xs[2] + 104, ringY = 252, floorY = 332;
  if (t >= tb) {
    const lp = eOut(seg(t, tb, tb + .25));
    ln([[bx - 64 * lp, 372], [bx + 64 * lp, 372]], 4, WH);
    // first landing = next beat after the pop, then one hop per beat
    const firstLand = A0 + Math.ceil((tb + .12 - A0) / P) * P;
    let y, sq = 0;
    if (t < firstLand) { const u = seg(t, tb, firstLand); y = lerp(ringY, floorY, u * u) - Math.sin(u * Math.PI) * 60; }
    else { const u = beatPh(t) / P; y = floorY - 4 * 90 * u * (1 - u); sq = u < .12 ? (1 - u / .12) * .22 : u > .92 ? (u - .92) / .08 * .1 : 0; }
    if (fin && t > FIN - .25) {                   // finale: the ball flies home into 동
      const q = eInOut(seg(t, FIN - .25, FIN + .05)); y = lerp(y, ringY, q); sq *= 1 - q;
    }
    if (fin && t > FIN + .05) { y = ringY; sq = 0; }
    circ(bx, y + 40 * sq * .5, 40, PINK, 1 + sq, 1 - sq);
  }
  // 2) 다이어트: fat & wide, then two straight bars squeeze it thin
  if (t >= t2) {
    const bp = eOut(seg(t, t2, t2 + .16)), sqz = spring(seg(t, t2 + .04, t2 + .5)), pulse = sbeat(t) * (t > t2 + .5 ? 1 : 0);
    const lx = lerp(830, 1060, bp) + pulse * 8, rx = lerp(1960, 1730, bp) - pulse * 8;
    C.save(); C.globalAlpha = clamp((t - t2) * 14);
    T('다이어트', 1395, 205, 230, { c: YEL, sx: lerp(1.12, .62, sqz) - pulse * .015, sy: lerp(.92, 1, sqz) });
    C.restore();
    ln([[lx, 80], [lx, 330]], 10, WH); ln([[rx, 80], [rx, 330]], 10, WH);
    const ap = clamp((t - t2 - .18) * 6);
    if (ap > 0) { ln([[lx - 70, 205], [lx - 20, 205]], 6, WH, ap); ln([[rx + 70, 205], [rx + 20, 205]], 6, WH, ap);
      T('▶', lx - 45 + pulse * 6, 205, 40, { f: 'P', w: 800, a: ap }); T('◀', rx + 45 - pulse * 6, 205, 40, { f: 'P', w: 800, a: ap }); }
  }
  // 3) 다산한의원: glossy syllables puff up one after another
  const total = tw('다산한의원', PUFF_S, 'Jua', '', PUFF_LS), cxs = xsOf(PUFF, 960 - total / 2, PUFF_S, 'Jua', '', PUFF_LS);
  PUFF.forEach((ch, i) => {
    const p = seg(t, t3 + i * .055, t3 + i * .055 + .5); if (p <= 0) return;
    let s = spring(p) * (1 + sbeat(t) * .02 * (p >= 1 ? 1 : 0));
    let dy = (1 - spring(p)) * 60;
    if (fin) { const q = seg(t, FIN + i * .03, FIN + i * .03 + .5); s *= 1 + Math.sin(q * Math.PI) * .14; }
    puffy(ch, cxs[i] + tw(ch, PUFF_S, 'Jua') / 2, 680 + dy, PUFF_S, s);
  });
  if (t > t3 + .35) T('®', 960 + total / 2 + 60, 560, 40, { f: 'P', w: 800, a: clamp((t - t3 - .35) * 5) });
  if (!fin || t < FIN + .2) pills(['남양주', '호평동', '다이어트'], 120, 1000, t3 + .25, t);
  if (fin && t > FIN + .2) {
    const q = spring(seg(t, FIN + .2, FIN + .75));
    C.save(); C.globalAlpha = clamp(q * 3); C.translate(0, (1 - q) * 30);
    C.font = '800 40px P'; const s = '남양주 호평동 · 호평로 33 · 031-559-8101', w2 = C.measureText(s).width + 80;
    C.fillStyle = WH; C.beginPath(); C.roundRect(960 - w2 / 2, 970, w2, 74, 37); C.fill();
    C.fillStyle = '#2340E6'; C.textAlign = 'center'; C.textBaseline = 'middle'; C.fillText(s, 960, 1008); C.restore();
  }
}

/* ---------- VERSE A: 뱃살은 쭉 / 체질 맞춰 쏙 ---------- */
function VERSE_A(t) {
  sylIn(['뱃살은'], [180], 210, 150, 'P', 300, V.bae - .05, 0, t);
  // 쭉 slides in from the right and leaves an echo trail behind it
  const jt = V.jjuk - LEAD;
  if (t >= jt) {
    const p = eOut(seg(t, jt, jt + .28)), x = lerp(2300, 1150, p);
    for (let k = 5; k >= 1; k--) {
      const ek = clamp((t - jt - .12 - (5 - k) * .03) * 8); if (ek <= 0) continue;
      T('쭉', lerp(x, x - k * 150, ek), 470, 420, { sx: 1.25 + k * .02, a: (.12 + (5 - k) * .1) * ek, c: k % 2 ? WH : PINK });
    }
    T('쭉', x, 470, 420, { sx: 1.5 + (1 - p) * .4 - sbeat(t) * .02 });
    const bp = spring(seg(t, jt + .18, jt + .6));
    if (bp > 0) { C.save(); C.translate(1640, 470); C.scale(1, bp); C.fillStyle = YEL; C.beginPath(); C.roundRect(-30, -230, 60, 330, 30); C.fill(); C.restore();
      circ(1640, 470 + 160 - (1 - bp) * 200, 52 * clamp(bp * 2), YEL); }
  }
  // floor line with a slot; 체질 맞춰 sits on it, 쏙 drops into the slot
  const lp = eOut(seg(t, V.che - .25, V.che + .2));
  if (lp > 0) { ln([[160, 760], [lerp(160, 1300, lp), 760]], 5, WH); if (lp > .99) { ln([[1560, 760], [1760, 760]], 5, WH);
    ln([[1300, 760], [1300, 830]], 5, WH); ln([[1560, 760], [1560, 830]], 5, WH); ln([[1300, 830], [1560, 830]], 5, WH, .35); } }
  sylIn(['체질 맞춰'], [180], 885, 130, 'P', 300, V.che - .05, 0, t);
  const st = V.ssok - LEAD - .18;
  if (t >= st) {
    const fall = seg(t, st, V.ssok - LEAD + .02), y = fall < 1 ? lerp(-150, 640, fall * fall) : lerp(640, 742, spring(seg(t, V.ssok - LEAD + .02, V.ssok + .4)));
    C.save(); C.beginPath(); C.rect(0, 0, W, 760); C.rect(1303, 760, 254, 68); C.clip();
    T('쏙', 1430, y, 260, { c: PINK, sy: fall < 1 ? 1.15 : 1 });
    C.restore();
  }
}

/* ---------- VERSE B: 몸은 가볍게 / 마음은 즐겁게 ---------- */
const wave = (x, t) => 790 + Math.sin((x - 300) / 180 + t * 2.2) * 46;
function VERSE_B(t) {
  sylIn(['몸은'], [200], 240, 120, 'P', 300, V.mom - .05, 0, t);
  [['가', 640, 240, -6], ['볍', 900, 190, 4], ['게', 1160, 230, -3]].forEach(([ch, x, y0, r], i) => {
    const p = seg(t, V.ga - LEAD + i * .08, V.ga - LEAD + i * .08 + .7); if (p <= 0) return;
    const y = lerp(1250, y0, spring(p)) + Math.sin(t * 2.4 + i * 1.7) * 10;
    const rr = r + Math.sin(t * 1.9 + i) * 3;
    const sw = Math.sin(t * 2.4 + i * 1.7 + .6) * 14;
    ln([[x, y + 118], [x - 20 + sw, y + 200], [x + 10 - sw * .5, y + 280]], 4, WH);
    C.save(); C.translate(x, y); C.rotate(rr * Math.PI / 180);
    const g = C.createRadialGradient(-30, -40, 10, 0, 0, 120); g.addColorStop(0, '#FFF7B8'); g.addColorStop(1, YEL);
    C.fillStyle = g; C.beginPath(); C.ellipse(0, 0, 105, 118, 0, 0, 7); C.fill(); C.restore();
    T(ch, x, y + 4, 120, { f: 'Jua', c: INK, rot: rr });
  });
  // the wavy baseline draws in, then 즐겁게 rides it, hopping on the beat
  const wp = eInOut(seg(t, V.ma - .45, V.ma + .1));
  if (wp > 0) { const pts = []; for (let x = 120; x <= lerp(120, 1800, wp); x += 10) pts.push([x, wave(x, t) + 70]); ln(pts, 8, YEL); }
  if (t > V.ma - .05) { const p = seg(t, V.ma - .05, V.ma + .3); C.save(); if (p < 1) C.filter = `blur(${(1 - p) * 8}px)`; T('마음은', 420, wave(420, t) - 40 + (1 - spring(p)) * 40, 120, { f: 'P', w: 300, a: clamp(p * 3) }); C.restore(); }
  [['즐', 900], ['겁', 1170], ['게', 1440], ['!', 1640]].forEach(([ch, x], i) => {
    const p = seg(t, V.jeul - LEAD + i * .1, V.jeul - LEAD + i * .1 + .45); if (p <= 0) return;
    const sl = Math.atan(Math.cos((x - 300) / 180 + t * 2.2) * 46 / 180) * 180 / Math.PI;
    const ph = beatPh(t + i * .12) / P, hop = p >= 1 ? 4 * 30 * ph * (1 - ph) : 0;
    T(ch, x, wave(x, t) - 50 - hop - (1 - spring(p)) * 120, 230, { c: PINK, rot: sl, sy: .6 + .4 * spring(p) });
  });
}

/* ---------- INTERLUDE + BRIDGE: the ball hops along, 33 pixels in, it flies to 그 건물 ---------- */
const P3 = ['111', '001', '011', '001', '111'], PX = 46;
const ROOF = [1650, 150];
function ballPath(t) {      // returns [x, y] of the travelling ball
  const t0 = bar(9), hopEnd = t0 + 4 * P;       // 4 hops along the floor during the interlude
  if (t < hopEnd) { const k = (t - t0) / P, u = k - Math.floor(k), n = Math.floor(k);
    const x = 150 + (n + u) * 105; return [x, 900 - 4 * 110 * u * (1 - u)]; }
  const jA = B.emart - .2, jB = B.geu - LEAD;  // the long jump to the roof
  if (t < jA) { const ph = beatPh(t) / P; return [150 + 4 * 105, 900 - 4 * 60 * ph * (1 - ph)]; }
  if (t < jB) { const u = eInOut(seg(t, jA, jB)), a = [570, 900], c1 = [820, 200], c2 = [1180, 0], b = [ROOF[0], ROOF[1] - 40];
    const m = 1 - u; return [m * m * m * a[0] + 3 * m * m * u * c1[0] + 3 * m * u * u * c2[0] + u * u * u * b[0], m * m * m * a[1] + 3 * m * m * u * c1[1] + 3 * m * u * u * c2[1] + u * u * u * b[1]]; }
  const ph = beatPh(t) / P; return [ROOF[0], ROOF[1] - 40 - 4 * 40 * ph * (1 - ph)];
}
function BRIDGE(t) {
  const t0 = bar(9);
  // dotted trail of where the ball has been (the dotted arrow builds itself)
  C.fillStyle = 'rgba(255,255,255,.75)';
  for (let s = t0 + .05; s < Math.min(t, B.geu - LEAD) - .04; s += .05) { const [x, y] = ballPath(s); C.beginPath(); C.arc(x, y, 5, 0, 7); C.fill(); }
  sylIn(['호평로'], [160], 240, 170, 'P', 100, B.ho - .1, 0, t);
  let idx = 0;
  [0, 1].forEach(d => P3.forEach((r, j) => r.split('').forEach((b, i) => { if (b !== '1') return;
    const ts = B.n33 - LEAD + idx++ * .014, p = spring(seg(t, ts, ts + .35)); if (p <= 0) return;
    const s = (PX - 6) * p, cx = 170 + d * 200 + i * PX + (PX - 6) / 2, cy = 380 + j * PX + (PX - 6) / 2;
    C.fillStyle = YEL; C.fillRect(cx - s / 2, cy - s / 2, s, s); })));
  pills(['남양주시', '호평로 33'], 160, 1000, B.n33 + .2, t);
  // the building: straight roof + ground, 그/건/물 stacked
  const rp = eOut(seg(t, B.emart - .12, B.emart + .25));
  if (rp > 0) { ln([[1440 - 250 * rp, 150], [1440 + 250 * rp, 150]], 10, WH); ln([[1440 - 290 * rp, 900], [1440 + 290 * rp, 900]], 10, WH);
    T('이마트', 1440, 108 + (1 - rp) * 20, 72, { f: 'P', w: 800, a: rp }); }
  const gt = B.geu - LEAD - .2;
  [['그', 280], ['건', 520], ['물', 760]].forEach(([ch, y], i) => {
    if (t < gt) return;
    const fall = seg(t, gt, gt + .2), yy = fall < 1 ? lerp(y - 900, y, fall * fall) : y;
    const sq = fall >= 1 ? Math.exp(-(t - gt - .2) * 9) * Math.sin((t - gt - .2) * 30) * .12 : 0;
    C.save(); C.beginPath(); C.rect(1100, 160, 700, 735); C.clip();
    T(ch, 1440, yy + 115 * sq, 230, { sx: 1.9 * (1 + sq), sy: 1 - sq });
    C.restore();
  });
  const ep = spring(seg(t, B.geu + .05, B.geu + .45));
  if (ep > 0) T('!', 1790, 760, 230, { c: PINK, sy: ep });
  if (t > t0 - .02) { const [x, y] = ballPath(t); circ(x, y, 40, PINK); }
}

/* ---------- timeline ---------- */
const SC = [
  [0, bar(2), t => HOOK(t, 0, false)],
  [bar(2) - .12, V.bae - .12, t => HOOK(t, 1, false)],
  [V.bae - .12, V.mom - .12, VERSE_A],
