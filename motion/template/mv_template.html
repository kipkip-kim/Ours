<script>
/* ================= utilities ================= */
const $ = id => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const eOut = x => 1 - Math.pow(1 - x, 3);
const eIn = x => x * x * x;
const eInOut = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
// soft damped spring: overshoots ~8% once, then settles (no dead stop)
const spring = p => p <= 0 ? 0 : p >= 1 ? 1 : 1 - Math.exp(-6.5 * p) * Math.cos(8.5 * p);
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
const HN = '#FFB81C', AM = '#E8890C', BR = '#2A1D0E', CR = '#F6EEDD', DK = '#17110A', AC = '#FF5A1F';
const W = 1920, H = 1080;

/* ================= beat clock ================= */
const PERIOD = 0.4644;
const B = window.BEATS.slice();
while (B[B.length - 1] < 84) B.push(+(B[B.length - 1] + PERIOD).toFixed(3));
function beatIdx(t) { let i = -1; for (let k = 0; k < B.length; k++) { if (B[k] <= t) i = k; else break; } return i; }
function pulse(t, k = 7) { const i = beatIdx(t); return i < 0 ? 0 : Math.exp(-(t - B[i]) * k); }
// smooth beat (no instant jump): quick rise, slow fall
function sbeat(t) { const i = beatIdx(t); if (i < 0) return 0; const d = t - B[i]; return d < .05 ? eOut(d / .05) : Math.exp(-(d - .05) * 6); }

/* ================= lyrics (ElevenLabs Scribe word timings) ================= */
const LINES = [
  { s: 1.72, w: [['여러분!', 1.72, 2.10]] },
  { s: 3.44, w: [['여기', 3.44, 3.58], ['좀', 3.70, 3.72], ['봐요!', 3.82, 4.36]] },
  { s: 8.00, w: [['무릎이', 8.00, 8.38], ['시큰,', 8.46, 8.64], ['계단', 8.74, 8.92], ['앞에서', 9.12, 9.34], ['멈칫', 9.52, 9.78]] },
  { s: 9.94, w: [['어깨가', 9.94, 10.28], ['뻐근,', 10.38, 10.52], ['팔이', 10.68, 10.78], ['안', 10.88, 10.90], ['올라가', 10.96, 11.20], ['찌릿', 11.36, 11.64]] },
  { s: 11.76, w: [['아침마다', 11.76, 12.14], ['허리', 12.26, 12.40], ['뻣뻣,', 12.54, 12.84], ['한숨이', 12.94, 13.10], ['푹', 13.22, 13.52]] },
  { s: 13.66, w: [['이제는', 13.66, 14.00], ['참지', 14.14, 14.26], ['마요,', 14.34, 14.46], ['방법이', 14.68, 14.98], ['있죠', 15.18, 15.44]] },
  { s: 22.38, w: [['쑤실', 22.38, 22.68], ['땐', 22.88, 22.92], ['봉침,', 23.28, 23.86], ['아플', 24.20, 24.56], ['땐', 24.74, 24.80], ['봉침', 25.14, 25.74]] },
  { s: 26.20, w: [['무릎', 26.20, 26.42], ['어깨', 26.58, 26.90], ['허리엔', 27.14, 27.62], ['봉침부터', 27.78, 28.56]] },
  { s: 28.98, w: [['진료', 28.98, 29.26], ['때', 29.42, 29.48], ['한마디,', 29.70, 30.20], ['봉침', 30.36, 30.66], ['놔', 30.86, 31.10], ['주세요', 31.10, 31.60]] },
  { s: 31.80, w: [['일로한방병원,', 31.80, 33.48], ['봉침부터', 33.66, 34.66]] },
  { s: 35.76, w: [['꿀벌', 35.76, 36.06], ['봉독', 36.24, 36.40], ['깨끗하게', 36.50, 37.00], ['정제해서', 37.20, 38.16]] },
  { s: 39.54, w: [['가는', 39.54, 39.78], ['주사로', 39.94, 40.26], ['아픈', 40.42, 40.74], ['관절에', 40.96, 41.40], ['쏙!', 41.84, 42.10]] },
  { s: 43.00, w: [['논문으로', 43.00, 43.54], ['확인,', 43.86, 44.72], ['통증은', 44.92, 45.44], ['다운', 45.60, 45.90]] },
  { s: 47.06, w: [['진료지침에도', 47.06, 48.22], ['권고,', 48.62, 49.16], ['딱!', 49.38, 49.60]] },
  { s: 50.82, w: [['우리', 50.82, 51.08], ['엄마', 51.70, 51.92], ['쑤실', 52.38, 52.46], ['때도', 52.68, 53.38], ['봉침', 53.54, 53.86], ['놔', 54.08, 54.40], ['드려요', 54.40, 55.12]] },
  { s: 56.18, w: [['피부반응검사', 56.18, 58.08], ['먼저,', 58.30, 58.80], ['안심하세요', 59.68, 60.92]] },
  { s: 63.64, w: [['쑤실', 63.64, 63.94], ['땐', 64.12, 64.18], ['봉침,', 64.52, 65.12], ['아플', 65.48, 65.80], ['땐', 66.00, 66.06], ['봉침', 66.40, 67.00]] },
  { s: 67.44, w: [['무릎', 67.44, 67.66], ['어깨', 67.94, 68.14], ['허리엔', 68.76, 68.86], ['봉침부터', 69.02, 70.00]] },
  { s: 70.26, w: [['진료', 70.26, 70.50], ['때', 70.66, 70.72], ['한마디,', 70.94, 71.44], ['봉침', 71.60, 71.90], ['놔', 72.10, 72.40], ['주세요', 72.40, 72.86]] },
  { s: 73.06, w: [['일로한방병원,', 73.06, 74.24], ['봉침부터', 74.90, 75.74]] },
  { s: 78.66, w: [['봉침부터!', 78.66, 79.20]] },
];
LINES.forEach(l => l.e = l.w[l.w.length - 1][2]);

const HITS = [1.72, 3.82, 8.46, 11.36, 13.22, 22.38, 23.28, 25.14, 27.78, 31.30, 33.66, 41.84, 48.62, 49.38, 59.68, 63.64, 64.52, 66.40, 69.02, 72.55, 74.90, 78.66];
function hitAmt(t) { let a = 0; for (const h of HITS) { const d = t - h; if (d < 0 || d > 1) continue; a = Math.max(a, d < .07 ? eOut(d / .07) : Math.exp(-(d - .07) * 6)); } return a; }
// honey ripples through the comb: [time, x, y, strength]
const RIPS = [...HITS.map(h => [h, 960, 560, 1])];
B.filter((b, i) => i % 2 === 1 && b > 16 && b < 22.2).forEach(b => RIPS.push([b, 960, 500, .7]));
RIPS.push([41.84, 1340, 560, 1.2]); RIPS.push([1.70, 960, 540, 1.2]);

/* ================= sections ================= */
const S = [['intro', 0, 7.85], ['v1', 7.85, 15.6], ['build', 15.6, 22.3], ['ch1', 22.3, 35.5], ['v2', 35.5, 50.6], ['br', 50.6, 61.3], ['build2', 61.3, 63.55], ['ch2', 63.55, 76.0], ['out', 76.0, 82.0]];
const secIdx = t => { for (let i = S.length - 1; i >= 0; i--) if (t >= S[i][1]) return i; return 0; };

/* ================= background: one honey world ================= */
const BGC = { dark: DK, cream: CR, honey: HN };
const ADC = { dark: CR, cream: BR, honey: BR };
const lw = (o, k) => LINES[o].w[k][1];
// background changes = honey-drop wipes (never hard cuts). [time, mode, x, y, duration]
const BGT = [[0, 'dark'], [3.80, 'cream', 960, 560, .42], [9.88, 'dark', 960, 560, .4], [11.70, 'cream', 960, 560, .4], [13.60, 'dark', 960, 560, .4]];
function chorusBG(o) {
  BGT.push([lw(o, 2) - .13, 'honey', 960, 640, .26, 1], [lw(o, 3) - .1, 'dark', 960, 640, .3, 1], [lw(o, 5) - .13, 'honey', 960, 640, .26, 1],
    [lw(o + 1, 3) - .13, 'dark', 960, 600, .28, 1], [LINES[o + 2].s - .1, 'cream', 960, 560, .42], [LINES[o + 3].s - .1, 'dark', 960, 420, .45]);
}
chorusBG(6);
BGT.push([42.74, 'cream', 960, 560, .45], [46.74, 'dark', 960, 560, .45], [49.38 - .13, 'honey', 960, 600, .26, 1], [50.5, 'cream', 960, 560, .55], [55.7, 'dark', 1280, 560, .55], [61.22, 'honey', 960, 540, .4], [63.48, 'dark', 960, 540, .42]);
chorusBG(16);
BGT.sort((a, b) => a[0] - b[0]);
function bgState(t) { let i = 0; for (let k = 0; k < BGT.length; k++) if (BGT[k][0] <= t) i = k; const b = BGT[i]; const q = seg(t, b[0], b[0] + b[4]), p = i === 0 ? 1 : b[5] ? eOut(q) : eInOut(q); return { from: i ? BGT[i - 1][1] : b[1], to: b[1], x: b[2], y: b[3], r: p * 2400, p }; }
function bgModeAt(t, x, y) { const s = bgState(t); return s.p >= 1 || Math.hypot(x - s.x, y - s.y) < s.r ? s.to : s.from; }

const cv = $('bg'), ctx = cv.getContext('2d');
function fill(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function glow(x, y, r, col) { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); }
const HEX = 62, HW = Math.sqrt(3) * HEX, HH = 1.5 * HEX;
const HV = [...Array(6)].map((_, i) => { const a = (60 * i - 30) * Math.PI / 180; return [Math.cos(a), Math.sin(a)]; });
const HEXC = { dark: 'rgba(255,184,28,.08)', cream: 'rgba(160,100,20,.12)', honey: 'rgba(42,29,14,.10)' };
const LITC = { dark: '255,184,28', cream: '255,184,28', honey: '255,248,225' };
const GLC = { dark: 'rgba(255,160,30,.13)', cream: 'rgba(255,196,70,.28)', honey: 'rgba(255,246,215,.38)' };
let ZOOM = { k: 1, x: 960, y: 540 };
function hexPath(x, y, r) { ctx.moveTo(x + HV[0][0] * r, y + HV[0][1] * r); for (let i = 1; i < 6; i++) ctx.lineTo(x + HV[i][0] * r, y + HV[i][1] * r); ctx.closePath(); }
function paintBase(mode, t) {
  fill(BGC[mode]);
  glow(W / 2 + Math.cos(t * .21) * 560, H / 2 + Math.sin(t * .17) * 260, 900, GLC[mode]);
  glow(W / 2 + Math.cos(t * .16 + 2.5) * 620, H / 2 + Math.sin(t * .23 + 1.2) * 300, 700, GLC[mode]);
  ctx.save();
  if (ZOOM.k !== 1) { ctx.translate(ZOOM.x, ZOOM.y); ctx.scale(ZOOM.k, ZOOM.k); ctx.translate(-ZOOM.x, -ZOOM.y); }
  const ox = (t * 16) % HW, oy = (t * 9) % (HH * 2), sr = Math.floor(t * 9 / (HH * 2)) * 2, sc = Math.floor(t * 16 / HW);
  const act = RIPS.filter(r => t - r[0] >= 0 && t - r[0] < 1.5);
  const bi = beatIdx(t), pb = sbeat(t);
  const lit = [];
  ctx.beginPath();
  for (let r = -3; r * HH < H + HH * 3; r++) for (let c = -2; c * HW < W + HW * 2; c++) {
    const x = c * HW + (r & 1 ? HW / 2 : 0) + ox - HW, y = r * HH + oy - HH * 2;
    hexPath(x, y, HEX * .93);
    const R = r - sr, Cc = c + sc;
    let k = hash(R * 73.13 + Cc * 19.71 + bi * 3.37) > .955 ? pb * .7 : 0;
    for (const a of act) { const dt = t - a[0], d = Math.hypot(x - a[1], y - a[2]); k = Math.max(k, Math.exp(-Math.pow((d - dt * 1250) / 120, 2)) * (1 - dt / 1.5) * a[3]); }
    if (k > .03) lit.push([x, y, k]);
  }
  ctx.strokeStyle = HEXC[mode]; ctx.lineWidth = 2; ctx.stroke();
  for (const [x, y, k] of lit) { ctx.fillStyle = `rgba(${LITC[mode]},${clamp(k) * .4})`; ctx.beginPath(); hexPath(x, y, HEX * .86); ctx.fill(); }
  ctx.restore();
}
function paintBG(t) {
  const s = bgState(t);
  paintBase(s.from === s.to || s.p >= 1 ? s.to : s.from, t);
  if (s.p < 1 && s.from !== s.to) {
    ctx.save(); ctx.beginPath();
    for (let i = 0; i <= 72; i++) { const a = i / 72 * Math.PI * 2, rr = s.r * (1 + .035 * Math.sin(a * 7 + t * 5)); const x = s.x + Math.cos(a) * rr, y = s.y + Math.sin(a) * rr; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.clip(); paintBase(s.to, t); ctx.restore();
  }
}
// canvas honey drop (teardrop, tip up)
function honeyDrop(x, y, r, stretch = 1, alpha = 1) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.scale(1 / Math.sqrt(stretch), stretch);
  const g = ctx.createRadialGradient(-r * .3, r * .1, r * .1, 0, 0, r * 1.2); g.addColorStop(0, '#FFF2C4'); g.addColorStop(.3, '#FFC93C'); g.addColorStop(.75, '#F29A0A'); g.addColorStop(1, '#B85C00');
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(0, -r * 1.7); ctx.bezierCurveTo(r * .5, -r * 1.1, r, -r * .5, r, 0); ctx.arc(0, 0, r, 0, Math.PI); ctx.bezierCurveTo(-r, -r * .5, -r * .5, -r * 1.1, 0, -r * 1.7); ctx.fill();
  ctx.fillStyle = 'rgba(255,250,230,.75)'; ctx.beginPath(); ctx.ellipse(-r * .38, r * .05, r * .16, r * .3, .4, 0, 7); ctx.fill();
  ctx.restore();
}
function honeyBall(x, y, r, sx = 1, sy = 1, alpha = 1) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x, y); ctx.scale(sx, sy);
  const g = ctx.createRadialGradient(-r * .35, -r * .4, r * .05, 0, 0, r); g.addColorStop(0, '#FFF6D8'); g.addColorStop(.25, '#FFD25C'); g.addColorStop(.7, '#E68A00'); g.addColorStop(1, '#8A4500');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.beginPath(); ctx.ellipse(-r * .35, -r * .45, r * .22, r * .12, -.6, 0, 7); ctx.fill();
  ctx.restore();
}
function honeySpheres(t, n, alpha) {
  for (let i = 0; i < n; i++) {
    const r = 60 + hash(i * 3) * 90, ph = hash(i) * 6;
    const x = (hash(i * 5.3) * (W + 400) + t * (40 + hash(i) * 50)) % (W + 400) - 200;
    const y = H * .55 + Math.sin(t * 1.1 + ph) * 300 - sbeat(t) * 18 * (i % 2 ? 1 : -1);
    honeyBall(x, y, r, 1, 1, alpha);
  }
}
// hex cell that fills with honey (used as the one "loader" motif)
function hexFill(cx, cy, R, p, t, alpha = 1, scale = 1) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(cx, cy); ctx.scale(scale, scale);
  ctx.beginPath(); hexPath(0, 0, R); ctx.fillStyle = 'rgba(23,17,10,.92)'; ctx.fill();
  ctx.save(); ctx.clip();
  const lv = R - p * 2 * R, amp = p > 0 && p < 1 ? 14 : 0;
  ctx.beginPath(); ctx.moveTo(-R - 10, R + 10);
  for (let x = -R - 10; x <= R + 10; x += 10) ctx.lineTo(x, lv + Math.sin(x * .025 + t * 5) * amp);
  ctx.lineTo(R + 10, R + 10); ctx.closePath();
  const g = ctx.createLinearGradient(0, -R, 0, R); g.addColorStop(0, '#FFD25C'); g.addColorStop(1, '#E8890C'); ctx.fillStyle = g; ctx.fill();
  ctx.restore();

    `<svg width="150" height="20" style="transform:rotate(-30deg)"><use href="#syr" width="150" height="20"/></svg>`];
  const hexClip = 'clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)';
  build('v2', `
    ${['꿀벌', '봉독', '정제', '약침'].map((n, i) => `<div class="abs" id="p_n${i}" style="left:${xs[i] - 140}px; top:300px; width:280px; text-align:center">

    <div class="abs lab ad" id="t_2" style="left:120px; top:820px; font-size:110px">아픈 관절에</div>
    <svg class="abs" id="t_syr" width="700" height="92" viewBox="0 0 460 60" style="left:0; top:514px; transform-origin:50% 50%">
      <g id="t_pl"><line x1="0" y1="30" x2="110" y2="30" stroke="#D8CBB5" stroke-width="5" stroke-linecap="round"/><rect x="110" y="20" width="24" height="20" rx="3" fill="#CDBFA8"/></g>
      <rect x="134" y="8" width="210" height="44" rx="8" fill="${CR}" stroke="${BR}" stroke-width="5"/>

      <text x="0" y="44" font-family="P" font-weight="700" font-size="26" fill="${BR}">통증</text><text x="720" y="526" font-family="P" font-weight="700" font-size="26" fill="${BR}">시간</text>
      <path d="M60 70 L760 70" stroke="rgba(42,29,14,.25)" stroke-width="4" stroke-dasharray="10 12" fill="none"/>

      <g id="g_dot"><use href="#drop" x="-24" y="-48" width="48" height="62"/></g></svg>
    <div class="abs ad" id="g_r1" style="left:1130px; top:360px; font-weight:800; font-size:84px">통증은</div>
    <div class="abs bhs" id="g_r2" style="left:1110px; top:470px; font-size:260px; color:${AC}">다운 ↓</div>
    <div class="abs c bhs ad" id="k_1" style="top:160px; font-size:150px">진료지침에도</div>
    <div class="abs c" id="k_2" style="top:400px; transform-origin:50% 50%"><div style="display:inline-flex; width:400px; height:400px; border-radius:50%; background:${HN}; align-items:center; justify-content:center; box-shadow:0 0 0 18px rgba(255,184,28,.22)"><span class="bhs" style="font-size:180px; color:${BR}">권고</span></div></div>
    <div class="abs c bhs ad" id="k_3" style="top:200px; font-size:640px">딱!</div>`);
  // 1) 꿀벌 → 봉독 → 정제 → 약침 : one honey drop's journey
  if (t < 39.6) {
    const pa = seg(t, 35.5, 35.9) * (1 - seg(t, 39.1, 39.5));
    ctx.save(); ctx.globalAlpha = pa;
    ctx.strokeStyle = 'rgba(255,184,28,.45)'; ctx.lineWidth = 3; ctx.setLineDash([10, 14]); ctx.lineDashOffset = -t * 70; ctx.beginPath(); ctx.moveTo(0, 427); ctx.lineTo(W, 427); ctx.stroke(); ctx.setLineDash([]);
    for (let i = 0; i < 360; i++) {
      const sp = 110 + hash(i) * 150, x = ((hash(i * 7) * W + t * sp) % (W + 100)) - 50, ord = x > 1190;
      const y = 427 + (ord ? (Math.floor(hash(i * 5) * 5) - 2) * 22 : (hash(i * 11) - .5) * 260 + Math.sin(t * 3 + i) * 30);
      ctx.fillStyle = ord ? 'rgba(255,184,28,.95)' : `rgba(246,238,221,${.15 + hash(i) * .3})`;

  A('t_2', t, w11[2][1] - .12, 42.5, { dx: 240 });
  const tgA = spring(seg(t, w11[3][1] - .15, w11[3][1] + .4)) * (1 - seg(t, 42.5, 42.85));
  if (tgA > 0 && t < 42.9) {
    const hit = seg(t, 41.84, 42.3);
    for (let i = 3; i >= 1; i--) { ctx.strokeStyle = `rgba(255,184,28,${.12 * i * tgA})`; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(1340, 560, (60 + i * 46 + Math.sin(t * 3 + i) * 6) * tgA, 0, 7); ctx.stroke(); }
    ctx.fillStyle = hit > 0 ? `rgba(255,${Math.round(lerp(90, 184, hit))},${Math.round(lerp(31, 28, hit))},${tgA})` : `rgba(255,90,31,${tgA})`;

  const sIn = spring(seg(t, w11[1][1] - .1, w11[1][1] + .5)), sGo = eInOut(seg(t, w11[3][1], w11[4][1])), sOut = seg(t, 42.45, 42.8);
  const sx = lerp(-760, 160, sIn) + sGo * 500 - eIn(sOut) * 300;
  if (t > w11[1][1] - .1 && t < 42.8) { const e = Q('t_syr'); e.style.display = ''; e.style.transform = `translate(${sx}px, ${Math.sin(t * 1.7) * 5}px)`; e.style.opacity = clamp((t - w11[1][1] + .1) * 4) * (1 - sOut); } else hide('t_syr');
  const inj = eOut(seg(t, 41.84, 42.4));
  Q('t_honey').setAttribute('width', 198 * (1 - inj)); Q('t_honey').setAttribute('x', 140 + 198 * inj); Q('t_pl').setAttribute('transform', `translate(${inj * 198} 0)`);
  A('t_ssok', t, w11[4][1] - .1, 42.5, { dy: -300, jelly: 1.6, hit: 1 });
  // 3) 논문으로 확인, 통증은 다운 — a honey drop slides down the curve
  A('g_t', t, w12[0][1] - .12, 46.6, { dx: -200 });
  A('g_s', t, w12[0][1] + .1, 46.6, { dx: -200, op: .7 });

  const cu = Q('g_curve'); const Lc = cu.getTotalLength(); cu.style.strokeDasharray = Lc; cu.style.strokeDashoffset = Lc * (1 - cp);
  const pt = cu.getPointAtLength(Lc * cp); Q('g_dot').setAttribute('transform', `translate(${pt.x} ${pt.y})`);
  A('g_r1', t, w12[2][1] - .1, 46.6, { dy: -80 });

  // 4) 진료지침에도 권고, 딱!

  A('k_2', t, w13[1][1] - .08, 49.24, { dy: 0, sc: 1.9, dur: .5 });
  A('k_3', t, w13[2][1] - .1, 50.42, { dy: -320, jelly: 1.6, hit: 1 });
}

/* ================= BRIDGE ================= */
function heartPt(u) { const a = u * Math.PI * 2; return [16 * Math.pow(Math.sin(a), 3), -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a))]; }
function heartTrail(t, cx, cy, sc, t0, t1, al) {
  const p = eInOut(seg(t, t0, t1)); ctx.save(); ctx.globalAlpha = al;
  ctx.strokeStyle = 'rgba(232,137,12,.85)'; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.beginPath();
  for (let u = 0; u <= p; u += .005) { const [x, y] = heartPt(u); u === 0 ? ctx.moveTo(cx + x * sc, cy + y * sc) : ctx.lineTo(cx + x * sc, cy + y * sc); } ctx.stroke();
  for (let j = 21; j >= 0; j--) { const u = p - j * .012; if (u < 0) continue; const [x, y] = heartPt(u); ctx.fillStyle = `rgba(255,184,28,${1 - j / 22})`; ctx.beginPath(); ctx.arc(cx + x * sc, cy + y * sc, 18 - j * .6, 0, 7); ctx.fill(); }
  if (p > 0 && p < 1) { const [x, y] = heartPt(p); honeyBall(cx + x * sc, cy + y * sc, 20); }
  ctx.restore();
}
function BR_(t) {
  const L1 = LINES[14].w;
  build('br', `
    <div class="abs bhs ad" id="r_1" style="left:150px; top:300px; font-size:150px">우리 엄마<span class="dot"></span></div>

    <svg class="abs" id="r_md" style="left:1105px; top:430px; transform-origin:50% 100%" width="350" height="268"><use href="#momdoc" width="350" height="268"/></svg>
    <div class="abs c bhs ad" id="s_lab" style="top:110px; font-size:84px">피부반응검사 먼저<span class="dot"></span></div>
    <div class="abs c bhs" id="s_pct" style="top:420px; font-size:120px; color:${CR}; text-shadow:0 5px 0 rgba(23,17,10,.35)">0%</div>

  if (t < 56.2) heartTrail(t, 1280, 560, 17, 50.9, 53.6, 1 - seg(t, 55.5, 56.0));
  A('r_1', t, L1[0][1] - .12, 55.55, { dx: -220 });

  const pk = eInOut(seg(t, 56.3, 59.4));

  Q('s_pct').textContent = Math.round(pk * 100) + '%';
  A('s_lab', t, LINES[15].s - .12, 61.05, { dy: -120 });
  A('s_pct', t, 56.05, 59.6, { dy: -300, out: .16 });
  A('s_ok', t, 59.64, 61.05, { dy: 0, sc: .3, dur: .5 });
  A('s_safe', t, 59.66, 61.05, { dy: -140, jelly: 1.3 });

/* ================= BUILD 2 ================= */
function BUILD2(t) {
  build('b2', `${[...Array(8)].map((_, r) => `<div class="abs bhs" id="m_r${r}" style="left:0; top:${-10 + r * 140}px; font-size:140px; color:${BR}; opacity:${r % 2 ? .14 : .26}">${('봉침 · 부터 · ').repeat(10)}</div>`).join('')}

/* ================= OUTRO ================= */
function OUT(t) {

  ctx.fillStyle = `rgba(0,0,0,${fade})`; ctx.fillRect(0, 0, W, H);

/* ================= lyrics caption ================= */
function LYR(t) {
  const box = $('lyr'); let L = null;
  for (let i = 2; i < LINES.length - 1; i++) { const l = LINES[i]; if (t >= l.s - .5 && t <= l.e + .5) L = l; }
  if (!L || t > 76) { box.style.opacity = 0; return; }
  if (box._L !== L) {
    box._L = L; const txt = L.w.map(w => w[0]).join(' ');
    box.innerHTML = `<div class="box"><span class="t">♪ ${txt}</span><span class="h">♪ ${txt}</span></div>`;
    box._h = box.querySelector('.h'); box._t = box.querySelector('.t');
    const r = document.createRange(); box._pos = [];
    const tn = box._t.firstChild; let idx = 2;
    L.w.forEach(w => { r.setStart(tn, idx); r.setEnd(tn, idx + w[0].length); const rc = r.getBoundingClientRect(); box._pos.push([rc.left, rc.width]); idx += w[0].length + 1; });
    box._left = box._t.getBoundingClientRect().left;
  }
  const k = eInOut(seg(t, L.s - .5, L.s - .2)) * (1 - eInOut(seg(t, L.e + .2, L.e + .5)));
  box.style.opacity = k; box.style.transform = `translateY(${(1 - k) * 16}px)`;
  let x = box._pos[0][0] - box._left;
  L.w.forEach((w, i) => { if (t >= w[1]) x = box._pos[i][0] - box._left + box._pos[i][1] * clamp((t - w[1]) / Math.max(.1, w[2] - w[1])); });
  box._h.style.clipPath = `inset(-20px calc(100% - ${x}px) -20px -20px)`;
}

/* ================= main ================= */
const FN = { intro: INTRO, v1: V1, build: BUILD, ch1: t => CHORUS(t, false), v2: V2, br: BR_, build2: BUILD2, ch2: t => CHORUS(t, true), out: OUT };
window.render = function (t) {
  ctx.setLineDash([]); ctx.globalAlpha = 1; ZOOM = { k: 1, x: 960, y: 540 };
  const si = secIdx(t);
  // previous section keeps running briefly so its exits overlap the new entrances
  const active = [si]; if (si > 0 && t < S[si][1] + .5) active.unshift(si - 1);
  if (S[si][0] === 'v2' || (si > 0 && S[si - 1][0] === 'v2' && active.length === 2)) ZOOM = { k: 1 + .45 * eInOut(seg(t, 39.2, 42.5)) * (1 - eInOut(seg(t, 42.5, 43.3))), x: 1340, y: 560 };

};
window.fitAll = async function () {
  // build every scene once and preload every glyph so no frame renders with fallback fonts
  let txt = '';
  for (let t = 0; t < 82; t += .25) { window.render(t); txt += $('layer').textContent; }
  txt += LINES.map(l => l.w.map(w => w[0]).join(' ')).join(' ') + '♪✓↓·0123456789%“”!';
  const uniq = [...new Set(txt)].join('');
  $('pre').innerHTML = [700, 800, 900].map(w => `<div style="font-family:P; font-weight:${w}">${uniq}</div>`).join('') + `<div style="font-family:'Black Han Sans'">${uniq}</div>`;
  await document.fonts.ready; await new Promise(r => setTimeout(r, 300)); await document.fonts.ready;
  window.render(0);
};
